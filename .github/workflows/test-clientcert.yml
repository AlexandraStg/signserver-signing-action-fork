name: test clientcert

on:
 workflow_dispatch:
 #push:
   #branches: [master]

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
       
    - name: Start SignServer Container
      run: sudo docker run -d -it --rm --name signserver -p 80:8080 -p 443:8443 -e LOG_LEVEL_APP=DEBUG -e ALLOW_ANY=true -v "$GITHUB_WORKSPACE/testing/DSSRootCA10.cacert.pem:/mnt/external/secrets/tls/cas/ManagementCA.crt" -h localhost keyfactor/signserver-ce:7.3.2  
          
    - name: Wait for Container to deploy
      run: sleep 180s
      shell: bash

    - name: Add CryptoTokenP12
      env:
        PASSWORD: ${{ secrets.CLIENT_CERT_PWD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PWD }}
      run: |
          set -o pipefail
          jq -n -c '{"properties": {
                "KEYSTOREPATH": "/opt/signserver/res/test/dss10/dss10_keystore.p12",
                "IMPLEMENTATION_CLASS": "org.signserver.server.signers.CryptoWorker",
                "KEYSTORETYPE": "PKCS12",
                "TYPE": "CRYPTO_WORKER",
                "CRYPTOTOKEN_IMPLEMENTATION_CLASS": "org.signserver.server.cryptotokens.KeystoreCryptoToken",
                "KEYSTOREPASSWORD": $ENV.KEYSTORE_PASSWORD,
                "NAME": "CryptoTokenP12" }}' |
          curl --config <(printf -- '--cert "%s:%s"\n' "$GITHUB_WORKSPACE/testing/dss10_admin1.p12" "$PASSWORD") --fail --cert-type P12 \
          --data-binary @- \
          -H "Content-Type: application/json" \
          -H "X-Keyfactor-Requested-With: 1" https://localhost:443/signserver/rest/v1/workers \
          --insecure 
             
    - name: Add JArchiveSigner
      env:
        PASSWORD: ${{ secrets.CLIENT_CERT_PWD }}
      run: |
          printf -- '--cert "%s:%s"\n' "$GITHUB_WORKSPACE/testing/dss10_admin1.p12" "$PASSWORD" | curl --config - --fail --cert-type P12 \
          -d '{"properties": {
                "DEFAULTKEY": "signer00003",
                "NAME": "JArchiveSigner",
                "CRYPTOTOKEN": "CryptoTokenP12",
                "AUTHTYPE": "CLIENTCERT",
                "IMPLEMENTATION_CLASS": "org.signserver.module.jarchive.signer.JArchiveSigner",
                "TYPE": "PROCESSABLE",
                "DISABLEKEYUSAGECOUNTER": "true" }}' \
          -H "Content-Type: application/json"  \
          -H "X-Keyfactor-Requested-With: 1" \
          https://localhost:443/signserver/rest/v1/workers \
          --insecure
          
    - name: Authorize client cert on JArchiveSigner
      env:
        PASSWORD: ${{ secrets.CLIENT_CERT_PWD }}
      run: |
          CERT_PEM=$(mktemp)
          openssl pkcs12 -in "$GITHUB_WORKSPACE/testing/dss10_admin1.p12" \
            -clcerts -nokeys -passin env:PASSWORD \
            -out "$CERT_PEM"
          docker cp "$CERT_PEM" signserver:/tmp/dss10_admin1-cert.pem
          docker exec -u root signserver chmod 644 /tmp/dss10_admin1-cert.pem
          docker exec signserver bin/signserver authorizedclients \
            -worker JArchiveSigner -add \
            -matchSubjectWithType CERTIFICATE_SERIALNO \
            -matchIssuerWithType ISSUER_DN_BCSTYLE \
            -description "CI client cert auth test" \
            -cert /tmp/dss10_admin1-cert.pem
          docker exec signserver bin/signserver reload JArchiveSigner
          rm -f "$CERT_PEM" 
      
    - name: Sign Jar OpenSSL
      id: sign-file-openssl
      uses: ./
      with:
        endpoint: https://localhost:443/signserver
        file-path: ${{ github.workspace }}/testing/HelloJar.jar
        worker-name: JArchiveSigner
        output-file-name: HelloJar-signed-openssl.jar
        client-cert: ${{ github.workspace }}/testing/dss10_admin1.p12
        password: ${{ secrets.CLIENT_CERT_PWD }}
        disable-cert-val: true
        rest: false
        
    - name: Sign Jar REST
      id: sign-file-rest
      uses: ./
      with:
        endpoint: https://localhost:443/signserver
        file-path: ${{ github.workspace }}/testing/HelloJar.jar
        worker-name: JArchiveSigner
        output-file-name: HelloJar-signed-rest.jar
        client-cert: ${{ github.workspace }}/testing/dss10_admin1.p12
        password: ${{ secrets.CLIENT_CERT_PWD }}
        disable-cert-val: true

    - name: Attempt sign without client cert (expect failure)
      id: sign-no-cert
      continue-on-error: true
      uses: ./
      with:
        endpoint: https://localhost:443/signserver
        file-path: ${{ github.workspace }}/testing/HelloJar.jar
        worker-name: JArchiveSigner
        output-file-name: HelloJar-signed-no-cert.jar
     
    - name: Assert unauthenticated request was rejected
      run: |
          if [ "${{ steps.sign-no-cert.outcome }}" != "failure" ]; then
            echo "Expected signing without a client cert to fail against a CLIENTCERT-protected worker, but it succeeded."
            exit 1
          fi
          echo "Confirmed: request without client cert was correctly rejected."
